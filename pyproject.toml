[project]
name = "frapp"
version = "0.0.1"
description = "FraPP + G.O.D.A.I. — ForReal App with AI Governance Control Plane"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlmodel>=0.0.14",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "anthropic>=2.3.0",
    "networkx>=3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

# Desktop-App unter Windows: eigenes Fenster (WebView2), API-Key im Windows-Tresor, Word-Export
windows = ["pywebview>=5.0", "keyring>=24.0", "python-docx>=1.1"]
app = ["pywebview>=5.0", "keyring>=24.0", "python-docx>=1.1"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["frapp*", "godai*", "contextos*", "scriptor*"]

[tool.setuptools.package-data]
scriptor = ["config.yaml", "genres/*.yaml", "app/static/*.html"]
godai = ["config/policies/*.yaml", "config/routing/*.yaml"]
frapp = ["static/*.html"]

[project.scripts]
scriptor = "scriptor.cli:main"
frapp = "frapp.cli:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = false
