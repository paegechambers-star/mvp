name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit pip-audit pytest pytest-cov pytest-asyncio
          pip install alembic
          pip install -e .

      - name: Lint (ruff + black)
        run: |
          ruff check .
          black --check .

      - name: Unit + integration tests (full coverage)
        run: |
          pytest \
            --cov=frapp \
            --cov=godai \
            --cov=contextos \
            --cov-report=xml \
            --cov-fail-under=70 \
            -x --tb=short

      - name: Smoke test
        run: python smoke_test.py

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Security scan (bandit)
        run: bandit -r src/ godai/ contextos/ -ll -q || true

      - name: SBOM (pip-audit)
        run: |
          mkdir -p diagnostics
          python -m pip_audit -f cyclonedx-json -o diagnostics/sbom.json || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: diagnostics/sbom.json

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v

  docs:
    needs: lint_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs gh-deploy --force
