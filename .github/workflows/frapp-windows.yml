name: FraPP Windows

on:
  push:
    paths:
      - "scriptor/**"
      - "packaging/windows/**"
      - "tests/**"
      - "src/frapp/**"
      - "godai/**"
      - "contextos/**"
      - "pyproject.toml"
      - "examples/scriptor_plugins/**"
      - ".github/workflows/frapp-windows.yml"
  pull_request:
    paths:
      - "scriptor/**"
      - "packaging/windows/**"
      - "tests/**"
      - "src/frapp/**"
      - "godai/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows]" pytest pytest-asyncio httpx
      - name: Tests (Windows)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Installer-Skript (echte Installation, ohne Verknüpfungen)
        shell: pwsh
        run: ./packaging/windows/install.ps1 -NoShortcut -Python (Get-Command python).Source
      - name: Build FraPP.exe
        shell: pwsh
        env:
          SCRIPTOR_PYTHON: python
        run: ./packaging/windows/build.ps1
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: FraPP-windows
          path: dist/FraPP-windows.zip
          retention-days: 30
