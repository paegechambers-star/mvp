# G.O.D.A.I. Routing Rules
# Version: 1.0 | Owner: Lucas William Chambers
#
# Deterministic model-selection rules evaluated by APOLLON.
# Rules are evaluated top-to-bottom; first matching condition wins.
# The 'default' entry is the mandatory catch-all fallback.
#
# Condition DSL: same as policy conditions (see policies/default.yaml)

version: "1.0"

routes:
  # Restricted data → highest-capability model, L3 only (already enforced by THEMIS)
  - condition: "data_class == RESTRICTED and trust_level >= L3"
    model: "claude-opus-4-6"
    reason: "Restricted data → maximum-capability model"

  # Sensitive data with elevated trust → trusted mid-tier model
  - condition: "data_class == SENSITIVE and trust_level >= L2"
    model: "claude-sonnet-4-6"
    reason: "Sensitive data + L2 trust → trusted Anthropic model"

  # Internal data → standard model
  - condition: "data_class == INTERNAL and trust_level >= L1"
    model: "claude-sonnet-4-6"
    reason: "Internal data → standard model"

  # Public data → efficient, cost-effective model
  - condition: "data_class == PUBLIC"
    model: "claude-haiku-4-5-20251001"
    reason: "Public data → efficient model"

  # Default catch-all (required — APOLLON raises RoutingConfigError if absent)
  - default:
      model: "claude-sonnet-4-6"
      reason: "Default fallback — no condition matched"
